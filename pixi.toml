[workspace]
name = "zlib"
version = "0.1.1"
authors = ["Marius S <marius@seritan.net>"]
description = "A Mojo zlib binding (inflate/deflate) via FFI to libz. Used for PDF FlateDecode (pdftotext.mojo) and general decompression."
preview = ["pixi-build"]
# Org nightly — matches headgate/flare so this resolves via `-I` against the same
# toolchain.
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64"]

[dependencies]
mojo = "==1.0.0"
zlib = ">=1.3.1,<2"
# The FFI shim is a pixi package (shim/); pixi builds it and installs
# lib/libzlibmojo.so into the env — no manual build step.
zlib-shim = { path = "shim" }

[tasks]
# Round-trip gate: deflate -> inflate -> original. The shim is dlopened at
# runtime from $CONDA_PREFIX/lib, installed by the zlib-shim package.
test = { cmd = "mkdir -p build && mojo build test/zlib_test.mojo -I src -o build/zlib-test && ./build/zlib-test" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is zlib-mojo (conda-forge owns "zlib"); the Mojo import
# stays `from zlib import …`.
[package]
name = "zlib-mojo"
version = "0.1.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/zlib"
name = "zlib"

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = "==1.0.0"
zlib-shim = { path = "shim" }
